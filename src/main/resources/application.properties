spring.application.name = @project.name@

app.prefix = !
app.groupId = @project.groupId@

# Remember to set these environment variables.
# This is how the launch command should like:
# java -jar Starter.jar --app.discord.token="token" --app.fluxer.token="token"
app.discord.token = ${TOKEN_DISCORD}
app.fluxer.token = ${TOKEN_FLUXER}

# If you want to add more properties, remember to follow the `app.source.property` convention.
# If you don't have a Discord or a Fluxer bot, you can safely remove the respective property above.

# In case you want to enable the logger feature, you will need to uncomment this line.
# app.logger = true

# You will also need to specify the channel in which you want the logging to go
# app.source.logger = id